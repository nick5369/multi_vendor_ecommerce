global:
  scrape_interval: 15s
scrape_configs:
  - job_name: auth-service
    static_configs: [{ targets: ["auth-service:3001"] }]
  - job_name: catalog-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["catalog-service:8081"] }]
  - job_name: order-service
    static_configs: [{ targets: ["order-service:8083"] }]
  - job_name: inventory-service
    static_configs: [{ targets: ["inventory-service:8084"] }]
  - job_name: payment-service
    static_configs: [{ targets: ["payment-service:8085"] }]
  - job_name: gateway
    static_configs: [{ targets: ["gateway:8080"] }]
  - job_name: rabbitmq
    static_configs: [{ targets: ["rabbitmq:15692"] }]
